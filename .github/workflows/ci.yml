name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Contract compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contract/package-lock.json
      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin Compact compiler
        run: compact update 0.31.1
      - name: Install contract dependencies
        working-directory: contract
        run: npm ci
      - name: Compile and test contract
        working-directory: contract
        run: npm run test:compile

  app:
    name: App lint and build
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin Compact compiler
        run: compact update 0.31.1
      - name: Install dependencies
        run: npm ci
      - name: Install contract dependencies
        working-directory: contract
        run: npm ci
      - name: Generate contract browser artifacts
        working-directory: contract
        run: npm run compact
      - run: npm run ci
